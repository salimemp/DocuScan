# Railway configuration — tells Railway how to build & run the backend
# See https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
# Note: NO startCommand here — let Dockerfile's CMD be authoritative.
# Mixing both confuses Railway's PORT injection.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Optional: pin the Python version that Railway will use
[build.nixpacksPlan]
providers = ["python"]
