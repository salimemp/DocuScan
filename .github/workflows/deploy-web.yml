# DocScan Pro — Web (Cloudflare Pages) auto-deploy
# ====================================================
# Builds the Expo web bundle from `frontend/` and deploys it to the
# Cloudflare Pages project `docscanpro` on every push to `main`.
# Pull requests get a preview deployment automatically (wrangler
# pages deploy handles the production-vs-preview branch logic).
#
# Required GitHub repository secrets (Settings → Secrets → Actions):
#
#   CLOUDFLARE_API_TOKEN
#     Cloudflare API token with the following permissions on the
#     account that owns the docscanpro Pages project:
#       - Account → Cloudflare Pages → Edit
#     Generate at:
#       https://dash.cloudflare.com/profile/api-tokens
#     Use the "Edit Cloudflare Pages" template, OR a custom token
#     with the scope above. Account ID is provided separately so
#     the token doesn't need Zone resources.
#
#   CLOUDFLARE_ACCOUNT_ID
#     Found at: https://dash.cloudflare.com → Workers & Pages →
#     docscanpro → "Account ID" in the right sidebar. Also visible
#     in any `*.pages.dev` URL: https://dash.cloudflare.com/<id>/pages
#
# Optional repository variables (Settings → Variables → Actions):
#
#   CLOUDFLARE_PROJECT_NAME
#     Defaults to "docscanpro". Override only if you renamed the
#     Pages project in the Cloudflare dashboard.
#
# Notes:
#   - `EXPO_PUBLIC_*` env vars are inlined at `npx expo export`
#     build time (the bundle captures them in the JS chunks). They
#     live in this workflow's env: block so every push builds with
#     the same backend / Turnstile settings as production.
#   - wrangler-action v3 is the replacement for the deprecated
#     `cloudflare/pages-action` (archived Oct 2024). See:
#       https://github.com/cloudflare/wrangler-action
#   - The "Sanity check _redirects" step is a guard against the
#     SPA-fallback bug fixed in 86d73b9. If anyone removes the
#     asset passthrough rules from `frontend/public/_redirects`,
#     the deploy will fail loudly instead of silently shipping a
#     broken web bundle.

name: Deploy Web to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write
  # Required so marocchino/sticky-pull-request-comment@v2 can post the
  # preview URL as a sticky comment on PRs (added 2026-06-28; same
  # fix that lives on PR #31's branch — duplicating here so PRs branch
  # off main work too).
  pull-requests: write

env:
  NODE_VERSION: '20'
  # Deploy to the 'docscanpro-site' project, which has the custom
  # domain docscanpro.app attached. (There's also a 'docscanpro'
  # project that was created during initial setup — that's a stale
  # duplicate; we deploy to docscanpro-site to ensure auto-deploys
  # flow through to the custom domain. The stale 'docscanpro'
  # project can be deleted manually via the Cloudflare dashboard.)
  PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'docscanpro-site' }}

jobs:
  build:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile || yarn install

      - name: Build Expo web bundle
        working-directory: frontend
        env:
          # Inlined at build time — see comment at top of file.
          EXPO_PUBLIC_BACKEND_URL: https://api.docscanpro.app
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAACxLwEuO5d52Pe0g'
          EXPO_PUBLIC_SITE_URL: https://docscanpro.app
          NODE_ENV: production
          CI: 'true'
        run: npx expo export -p web --output-dir dist

      - name: Disable Cloudflare Pages built-in SPA fallback
        # Cloudflare Pages assumes any project WITHOUT a top-level
        # 404.html is an SPA, and silently rewrites every unknown
        # path to / BEFORE user _redirects rules apply. That breaks
        # /assets/* passthroughs (the bug fixed in 86d73b9).
        # Adding 404.html flips Pages out of "SPA mode" and lets our
        # _redirects rules run directly on incoming URLs. The catch-
        # all `/* /index.html 200` still serves the SPA shell for
        # true client-side routes; unknown file paths now 404
        # correctly instead of getting rewritten.
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - name: Rename assets/node_modules to bypass wrangler IGNORE_LIST
        # wrangler's pages deploy has a hardcoded IGNORE_LIST that
        # skips files under /node_modules/ paths (cloudflare/workers-
        # sdk#3615, "won't fix"). Expo Metro emits Expo vector-icons
        # fonts and react-navigation icons under
        # /assets/node_modules/... — exactly the files wrangler skips.
        # Rename the dir to /assets/_nm/ and rely on a _redirects
        # rule (added in the next step) to translate URLs back so
        # the JS bundle's hardcoded /assets/node_modules/* references
        # still resolve.
        working-directory: frontend
        run: |
          if [ -d dist/assets/node_modules ]; then
            mv dist/assets/node_modules dist/assets/_nm
            echo "renamed dist/assets/node_modules → dist/assets/_nm"
          else
            echo "(dist/assets/node_modules not present — nothing to rename)"
          fi

      - name: Sanity check _redirects is intact
        working-directory: frontend
        run: |
          # Guard against the SPA-fallback bug: catch-all /index.html
          # was rewriting every /assets/*.ttf to index.html before
          # commit 86d73b9. These checks fail loud if a future change
          # ever drops or breaks the asset passthrough rules.
          test -s dist/_redirects || { echo "ERROR: dist/_redirects is missing or empty"; exit 1; }
          grep -q '^/assets/node_modules/\*  */assets/_nm/:splat  *200' dist/_redirects \
            || { echo "ERROR: /assets/node_modules/ → /assets/_nm/ translation rule missing from dist/_redirects (wrangler IGNORE_LIST won't upload files under /node_modules/)"; exit 1; }
          grep -q '^/assets/\*  */assets/:splat  *200' dist/_redirects \
            || { echo "ERROR: /assets/ passthrough rule missing from dist/_redirects"; exit 1; }
          grep -q '^/\*  */index.html  *200' dist/_redirects \
            || { echo "ERROR: catch-all /index.html rule missing from dist/_redirects"; exit 1; }
          test -s dist/404.html \
            || { echo "ERROR: dist/404.html missing — without it, Cloudflare Pages' built-in SPA fallback rewrites every URL to / BEFORE _redirects rules apply, breaking /assets/* passthroughs"; exit 1; }
          # Check that the rename actually happened.
          test -d dist/assets/_nm \
            || { echo "ERROR: dist/assets/_nm missing — the rename step didn't run or failed"; exit 1; }
          test ! -d dist/assets/node_modules \
            || { echo "ERROR: dist/assets/node_modules still exists — rename step didn't run"; exit 1; }
          echo "✓ dist/_redirects, dist/404.html, and node_modules rename all look correct"

      - name: Ensure Pages project exists
        # Self-healing: if this is the first deploy, the Pages project
        # may not exist yet. Create it via the Cloudflare REST API
        # directly. The API returns 200 with success=true if created,
        # or 409 if it already exists — both are "OK to proceed" for
        # us. Any other non-2xx is a real error.
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Ensuring Pages project '${{ env.PROJECT_NAME }}' exists..."
          HTTP_CODE=$(/usr/bin/curl -s -o /tmp/cf-create.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"${{ env.PROJECT_NAME }}","production_branch":"main","build_config":{"compatibility_date":"2024-12-01"}}' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects")
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/cf-create.json
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "409" ]; then
            echo "✓ Pages project ready (HTTP ${HTTP_CODE}: created or already exists)"
          else
            echo "✗ Failed to create Pages project (HTTP ${HTTP_CODE})" >&2
            exit 1
          fi

      - name: Update Pages build config to include post-build steps
        # PATCH the project's build_config so Cloudflare's GitHub
        # integration (which auto-deploys to the custom domain) uses
        # the SAME build command as our Actions workflow. This is
        # the critical step that makes pushes to main update the
        # custom domain docscanpro.app with our fixes — without it,
        # the GitHub integration rebuilds the project with its
        # dashboard-configured build command (no _redirects 404.html,
        # no node_modules→_nm rename) and the custom domain stays
        # stuck on the broken build.
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Updating build_config for ${{ env.PROJECT_NAME }}..."
          HTTP_CODE=$(/usr/bin/curl -s -o /tmp/cf-patch.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "build_config": {
                "build_command": "cd frontend && yarn install --frozen-lockfile || yarn install && npx expo export -p web --output-dir dist && cp dist/index.html dist/404.html && (test -d dist/assets/node_modules && mv dist/assets/node_modules dist/assets/_nm || echo \"(no node_modules rename needed)\")",
                "destination_dir": "frontend/dist",
                "root_dir": "",
                "compatibility_date": "2024-12-01"
              },
              "deployment_configs": {
                "preview": {
                  "build_command": "cd frontend && yarn install --frozen-lockfile || yarn install && npx expo export -p web --output-dir dist && cp dist/index.html dist/404.html && (test -d dist/assets/node_modules && mv dist/assets/node_modules dist/assets/_nm || echo \"(no node_modules rename needed)\")",
                  "destination_dir": "frontend/dist",
                  "compatibility_date": "2024-12-01"
                },
                "production": {
                  "build_command": "cd frontend && yarn install --frozen-lockfile || yarn install && npx expo export -p web --output-dir dist && cp dist/index.html dist/404.html && (test -d dist/assets/node_modules && mv dist/assets/node_modules dist/assets/_nm || echo \"(no node_modules rename needed)\")",
                  "destination_dir": "frontend/dist",
                  "compatibility_date": "2024-12-01"
                }
              }
            }' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${{ env.PROJECT_NAME }}")
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/cf-patch.json | head -c 500
          echo ""
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ build_config updated successfully"
          else
            echo "✗ Failed to update build_config (HTTP ${HTTP_CODE})" >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler 3.90.0 (the default) silently only uploads 61 of
          # 100 files in this project's dist — /assets/node_modules/.../*
          # are skipped, breaking icon fonts on the live site. Pin to
          # 4.x which handles the full file set correctly.
          wranglerVersion: '4'
          # --skip-caching forces a full re-upload instead of relying
          # on wrangler's content-hash dedup, which can undercount
          # files when the deployment has stale state. PRs still get
          # --branch=pr-{number} so they deploy as preview URLs.
          command: pages deploy frontend/dist --project-name=${{ env.PROJECT_NAME }} --commit-dirty=true --skip-caching ${{ github.event_name == 'pull_request' && format('--branch=pr-{0}', github.event.pull_request.number) || '' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote deployment to production
        # wrangler pages deploy creates PREVIEW deployments by default.
        # To make the custom domain (docscanpro.app) auto-update, we
        # need to either:
        #   (a) rely on Cloudflare's GitHub integration (which auto-
        #       deploys the production branch on push), OR
        #   (b) explicitly create a production deployment via the API.
        # We do both: the PATCH step above configures the project so
        # GitHub integration's auto-build uses our build command, AND
        # this step triggers a fresh production build that picks up
        # the latest source. After this runs, docscanpro.app points
        # at the new build within ~30s.
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ env.PROJECT_NAME }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Only trigger production builds on pushes to main, not on PRs.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Skipping production trigger — not a push event (${{ github.event_name }})"
            exit 0
          fi
          echo "Triggering production deployment for $CF_PROJECT at $COMMIT_SHA..."
          HTTP_CODE=$(/usr/bin/curl -s -o /tmp/cf-prod.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"branch\": \"main\",
              \"commit_hash\": \"${COMMIT_SHA}\",
              \"commit_message\": $(echo "$COMMIT_MSG" | /usr/bin/python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()[:200]))'),
              \"commit_dirty\": false
            }" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}/deployments")
          echo "HTTP ${HTTP_CODE}"
          head -c 500 /tmp/cf-prod.json
          echo ""
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ]; then
            DEPLOY_ID=$(/usr/bin/python3 -c "import json; print(json.load(open('/tmp/cf-prod.json')).get('result', {}).get('id', ''))" 2>/dev/null || echo "")
            echo "✓ Production deployment triggered (id=$DEPLOY_ID)"
          else
            echo "✗ Failed to trigger production deployment (HTTP $HTTP_CODE)" >&2
            cat /tmp/cf-prod.json >&2
            exit 1
          fi

      - name: Comment on PR with preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cloudflare-pages-preview
          message: |
            🚀 **Preview deployment ready**

            URL: ${{ steps.deploy.outputs.deployment-url }}

            Alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}

            This is a preview build of the web app for PR #${{ github.event.pull_request.number }}. It will be deleted when the PR is closed.
      - name: Print production deployment URL
        if: github.event_name != 'pull_request' && steps.deploy.outputs.deployment-url != ''
        run: |
          echo "🚀 Production deployment: ${{ steps.deploy.outputs.deployment-url }}"
          echo "   (custom domain docscanpro.app is updated on the Cloudflare dashboard)"
