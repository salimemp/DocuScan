# .github/workflows/secrets-scan.yml
# Runs gitleaks on every push and pull_request. Independent of the local
# .githooks/pre-commit script — so a contributor who hasn't enabled the
# local hooks still gets caught server-side.
#
# Why this exists: history already contains 5 leaked production keys
# (Gemini, Resend, Turnstile, Emergent, Expo). Even after rotation +
# git-filter-repo scrub, future regressions must be caught at PR time.
#
# Updated 2026-06-28 to use gitleaks/gitleaks-action@v2 with the new
# breaking-change API: v2 requires GITHUB_TOKEN explicitly and no
# longer accepts `version`, `config-path`, `upload-artifact` in `with:`.

name: secrets-scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  # Required so gitleaks can comment on PRs with findings.
  pull-requests: write
  # Required so gitleaks-action can upload SARIF to the Security tab.
  security-events: write

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so we catch secrets that landed and were
          # later removed. Without this, gitleaks only sees the diff
          # against the default branch.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # GITHUB_TOKEN is required for v2 to comment on PRs / upload SARIF.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tell gitleaks which config file to use (the project-local one
          # plus defaults). gitleaks-action v2 reads this env var.
          GITLEAKS_CONFIG: .gitleaks.toml
          # Disable verbose upload behavior we don't need (gitleaks-action
          # v2 changed the upload API — pass via env, not `with:`).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true