# .github/workflows/secrets-scan.yml
# Runs gitleaks on every push and pull_request. Independent of the local
# .githooks/pre-commit script — so a contributor who hasn't enabled the
# local hooks still gets caught server-side.
#
# Why this exists: history already contains 5 leaked production keys
# (Gemini, Resend, Turnstile, Emergent, Expo). Even after rotation +
# git-filter-repo scrub, future regressions must be caught at PR time.

name: secrets-scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  # Required so gitleaks can annotate PR comments on findings.
  pull-requests: write
  # Required so gitleaks-action can write SARIF back to the Security tab.
  security-events: write

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so we catch secrets that landed and were
          # later removed. Without this, gitleaks only sees the diff
          # against the default branch.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Use the project-local config (.gitleaks.toml) on top of
          # gitleaks defaults.
          GITLEAKS_CONFIG: .gitleaks.toml
          # Fail the build on any finding.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
        # Pin to a recent stable version. Update quarterly.
        with:
          version: 8.18.4
          config-path: .gitleaks.toml
          # Upload SARIF to the Security tab so findings are visible
          # across runs, even on non-default branches.
          upload-artifact: true